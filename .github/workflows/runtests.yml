name: Run endpoint tests

on:
  workflow_dispatch:

jobs:
  runtests:
    runs-on: ubuntu-latest

    env:
      SERVER_URL: ${{ vars.SERVER_URL }}

    steps:

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: DeLaGuardo/setup-clojure@13
        with:
          cli: latest

      - name: Run tests
        run: clojure -X:test
